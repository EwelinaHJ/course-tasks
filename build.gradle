plugins{
    id 'java'
    id 'se.thinkcode.cucumber-runner' version '0.0.11'
}
repositories {
    mavenCentral()
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
    implementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
    implementation 'com.codeborne:selenide:7.7.0'
    implementation 'io.cucumber:cucumber-java:7.21.1'
}
test  {
    useJUnitPlatform()
}
cucumber{
    glue = 'classpath: cucumber'
    plugin = ['pretty']
    featurePath ='src/test/resources/cucumberTests'
    main = 'io.cucumber.core.cli.Main'
}
